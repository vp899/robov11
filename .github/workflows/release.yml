# =============================================================================
# .github/workflows/release.yml — Release workflow
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/robocontrol

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build Release Binaries
  # ─────────────────────────────────────────────────────────────────────────────
  build-binaries:
    name: Build Release Binaries
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make cmake pkg-config \
            libssl-dev libhiredis-dev libjson-c-dev libcurl4-openssl-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            crossbuild-essential-arm64

      - name: Build (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          mkdir -p build-x86_64 && cd build-x86_64
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O2 -static-libgcc" \
            -DCMAKE_INSTALL_PREFIX=/usr
          make -j$(nproc)
          ctest --output-on-failure

      - name: Build (aarch64)
        if: matrix.arch == 'aarch64'
        run: |
          mkdir -p build-aarch64 && cd build-aarch64
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_C_FLAGS="-O2 -static-libgcc" \
            -DCMAKE_INSTALL_PREFIX=/usr
          make -j$(nproc)

      - name: Package binaries
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ARCH="${{ matrix.arch }}"
          TARBALL="robocontrol-${VERSION}-linux-${ARCH}.tar.gz"

          mkdir -p "release-${ARCH}/robocontrol-${VERSION}"
          if [ -d "build-${ARCH}/bin" ]; then
            cp -r "build-${ARCH}/bin/"* "release-${ARCH}/robocontrol-${VERSION}/"
          fi
          cp README.md LICENSE "release-${ARCH}/robocontrol-${VERSION}/" 2>/dev/null || true

          cd "release-${ARCH}"
          tar czf "${TARBALL}" "robocontrol-${VERSION}"
          echo "${TARBALL}" > tarball-name.txt

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            release-${{ matrix.arch }}/*.tar.gz
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Build & Push Docker Images
  # ─────────────────────────────────────────────────────────────────────────────
  docker-images:
    name: Docker Images
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        service: [signaling, relay, auth, billing]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Create GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-binaries, docker-images]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "${PREV_TAG}" ]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          # Write changelog to file
          cat > changelog.md << EOF
          # RoboControl ${GITHUB_REF#refs/tags/v}

          ## Changes
          ${CHANGES}

          ## Docker Images
          \`\`\`
          ghcr.io/robocontrol/signaling:${GITHUB_REF#refs/tags/v}
          ghcr.io/robocontrol/relay:${GITHUB_REF#refs/tags/v}
          ghcr.io/robocontrol/auth:${GITHUB_REF#refs/tags/v}
          ghcr.io/robocontrol/billing:${GITHUB_REF#refs/tags/v}
          \`\`\`

          ## Quick Start
          \`\`\`bash
          docker compose up -d
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: changelog.md
          files: |
            artifacts/**/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
