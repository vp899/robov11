# =============================================================================
# .github/workflows/ci.yml — Continuous Integration
# =============================================================================
name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/robocontrol

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build & Compile
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make cmake pkg-config \
            libssl-dev libhiredis-dev libjson-c-dev libcurl4-openssl-dev

      - name: Build all targets
        run: |
          if [ -f CMakeLists.txt ]; then
            mkdir -p build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-O2 -Wall -Wextra -Werror"
            make -j$(nproc)
          elif [ -f Makefile ]; then
            make -j$(nproc) all
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/bin/
            build/output/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Unit Tests
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make cmake pkg-config \
            libssl-dev libhiredis-dev libjson-c-dev libcurl4-openssl-dev

      - name: Run unit tests
        run: |
          if [ -f CMakeLists.txt ]; then
            mkdir -p build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Debug -DENABLE_TESTS=ON
            make -j$(nproc)
            ctest --output-on-failure --timeout 120
          elif [ -f Makefile ]; then
            make -j$(nproc) test
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            build/test-results/
            build/Testing/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Integration Tests
  # ─────────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start test environment
        run: docker compose -f docker-compose.test.yml up -d redis auth billing signaling relay

      - name: Wait for services
        run: |
          echo "Waiting for all services to be healthy..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9700/health >/dev/null 2>&1 && \
               curl -sf http://localhost:9800/health >/dev/null 2>&1 && \
               curl -sf http://localhost:9601/health >/dev/null 2>&1 && \
               curl -sf http://localhost:9500/health >/dev/null 2>&1; then
              echo "All services healthy!"
              exit 0
            fi
            echo "  Attempt $i/60 - waiting..."
            sleep 5
          done
          echo "Services did not become healthy in time"
          docker compose -f docker-compose.test.yml logs
          exit 1

      - name: Run integration tests
        run: |
          docker compose -f docker-compose.test.yml run --rm test-runner

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml logs > integration-logs.txt 2>&1

      - name: Upload integration logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: integration-logs.txt
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker Images
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-22.04
    needs: [unit-tests, integration-tests]
    strategy:
      matrix:
        service: [signaling, relay, auth, billing]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE=${{ matrix.service }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Lint & Security
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Security Scan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck on scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck deploy/scripts/*.sh || true

      - name: Run Hadolint on Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.build
          failure-threshold: warning

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
