# =============================================================================
# nginx/nginx.conf — Load balancer / reverse proxy for RoboControl
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    # ── Basic Settings ─────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;
    keepalive_requests 1000;

    types_hash_max_size 2048;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ── Gzip ───────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Rate Limiting ──────────────────────────────────────────────────────────
    # General API rate limit: 100 req/sec per IP
    limit_req_zone $binary_remote_addr zone=api_general:20m rate=100r/s;

    # Auth rate limit: 20 req/sec per IP (stricter)
    limit_req_zone $binary_remote_addr zone=api_auth:20m rate=20r/s;

    # Login rate limit: 5 req/sec per IP (brute-force protection)
    limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/s;

    # WebSocket connection limit: 10 per IP
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # ── Upstreams ──────────────────────────────────────────────────────────────
    upstream signaling_backend {
        least_conn;
        server signaling:9601 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    upstream signaling_ws {
        ip_hash;
        server signaling:9600 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    upstream relay_control {
        least_conn;
        server relay:9500 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream relay_data {
        least_conn;
        server relay:9501 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream auth_backend {
        least_conn;
        server auth:9700 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream billing_backend {
        least_conn;
        server billing:9800 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── SSL Configuration ─────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name robocontrol.example.com *.robocontrol.example.com;

        # Allow health checks over HTTP
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS Server ──────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name robocontrol.example.com *.robocontrol.example.com;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # ── Health Check Endpoint ──────────────────────────────────────────────
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── Signaling HTTP API ─────────────────────────────────────────────────
        location /api/v1/signal/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://signaling_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ── Signaling WebSocket ────────────────────────────────────────────────
        location /ws/signal {
            limit_conn ws_conn 10;
            proxy_pass http://signaling_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
        }

        # ── Relay Control API ──────────────────────────────────────────────────
        location /api/v1/relay/ {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://relay_control/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # ── Relay Data (TCP passthrough handled separately) ────────────────────
        # Note: Port 9501 is exposed directly via Docker/K8s, not through nginx.
        # Nginx handles HTTP/HTTPS only. Raw TCP relay uses port 9501 directly.

        # ── Auth API ───────────────────────────────────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=api_auth burst=10 nodelay;
            proxy_pass http://auth_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ── Auth Login (stricter rate limit) ───────────────────────────────────
        location /api/v1/auth/login {
            limit_req zone=api_login burst=3 nodelay;
            proxy_pass http://auth_backend/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Billing API ────────────────────────────────────────────────────────
        location /api/v1/billing/ {
            limit_req zone=api_general burst=10 nodelay;
            proxy_pass http://billing_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ── Prometheus Metrics (internal only) ─────────────────────────────────
        location /metrics {
            # Restrict to internal networks
            allow 172.20.0.0/16;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://signaling_backend/metrics;
            proxy_set_header Host $host;
        }

        # ── Default ────────────────────────────────────────────────────────────
        location / {
            return 404 '{"error":"not_found","message":"The requested resource does not exist"}';
            add_header Content-Type application/json;
        }

        # ── Error Pages ────────────────────────────────────────────────────────
        error_page 429 /429.json;
        location = /429.json {
            internal;
            return 429 '{"error":"rate_limited","message":"Too many requests. Please slow down."}';
            add_header Content-Type application/json;
        }

        error_page 502 503 504 /5xx.json;
        location = /5xx.json {
            internal;
            return 503 '{"error":"service_unavailable","message":"Service temporarily unavailable. Please retry."}';
            add_header Content-Type application/json;
        }
    }
}
