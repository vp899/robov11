            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 9700
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 9700
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: robocontrol
  labels:
    app: auth
spec:
  type: ClusterIP
  ports:
    - port: 9700
      targetPort: 9700
      name: http
  selector:
    app: auth
---
