# =============================================================================
# deploy/k8s/deployment.yaml — Full Kubernetes deployment
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# ConfigMaps
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: robocontrol-config
  namespace: robocontrol
data:
  RELAY_CONTROL_PORT: "9500"
  RELAY_DATA_PORT: "9501"
  SIGNALING_WS_PORT: "9600"
  SIGNALING_HTTP_PORT: "9601"
  SIGNALING_GOSSIP_PORT: "9602"
  AUTH_PORT: "9700"
  BILLING_PORT: "9800"
  REDIS_URL: "redis://redis:6379/0"
  BILLING_DB_URL: "redis://redis:6379/1"
  LOG_LEVEL: "info"
  METRICS_ENABLED: "true"
  METRICS_PORT: "9100"
  TOKEN_EXPIRY_SECONDS: "3600"
  MAX_CONNECTIONS: "100000"
---
# ─────────────────────────────────────────────────────────────────────────────
# Secrets (base64-encoded — replace with sealed-secrets or external-secrets in production)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: robocontrol-secrets
  namespace: robocontrol
type: Opaque
data:
  jwt_secret: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=    # "change-me-in-production"
  stripe_key: c2tfdGVzdF9jaGFuZ2VfbWU=              # "sk_test_change_me"
  grafana_password: YWRtaW4=                          # "admin"
---
# ─────────────────────────────────────────────────────────────────────────────
# Signaling Server
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signaling
  namespace: robocontrol
  labels:
    app: signaling
spec:
  replicas: 2
  selector:
    matchLabels:
      app: signaling
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: signaling
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: signaling
          image: ghcr.io/robocontrol/signaling:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9600
              name: ws
            - containerPort: 9601
              name: http
            - containerPort: 9602
              name: gossip
            - containerPort: 9100
              name: metrics
          envFrom:
            - configMapRef:
                name: robocontrol-config
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 9601
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 9601
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: signaling
  namespace: robocontrol
  labels:
    app: signaling
spec:
  type: ClusterIP
  ports:
    - port: 9600
      targetPort: 9600
      name: ws
    - port: 9601
      targetPort: 9601
      name: http
    - port: 9602
      targetPort: 9602
      name: gossip
  selector:
    app: signaling
---
# ─────────────────────────────────────────────────────────────────────────────
# Relay Server
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: robocontrol
  labels:
    app: relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: relay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: relay
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: relay
          image: ghcr.io/robocontrol/relay:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9500
              name: control
            - containerPort: 9501
              name: data
            - containerPort: 9100
              name: metrics
          envFrom:
            - configMapRef:
                name: robocontrol-config
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 9500
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 9500
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: robocontrol
  labels:
    app: relay
spec:
  type: LoadBalancer
  ports:
    - port: 9500
      targetPort: 9500
      name: control
    - port: 9501
      targetPort: 9501
      name: data
  selector:
    app: relay
---
# ─────────────────────────────────────────────────────────────────────────────
# Auth Service
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: robocontrol
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auth
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth
          image: ghcr.io/robocontrol/auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9700
              name: http
            - containerPort: 9100
              name: metrics
          envFrom:
            - configMapRef:
                name: robocontrol-config
